<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="940" viewBox="0 0 1800 940">
  <title>QRF-Net architecture vector diagram</title>
  <desc>Editable vector architecture diagram for a Quantum Readout Fusion Network.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3a45"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2468a8"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .outer { fill: #fbfcfe; stroke: #45525f; stroke-width: 2.1; stroke-dasharray: 8 6; }
      .box { fill: #ffffff; stroke: #2f3a45; stroke-width: 2; }
      .soft { fill: #f4f7fb; stroke: #506070; stroke-width: 1.8; }
      .accent { fill: #eef5fc; stroke: #2468a8; stroke-width: 2; }
      .tiny { fill: #ffffff; stroke: #5a6875; stroke-width: 1.4; }
      .line { stroke: #2f3a45; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .lineThin { stroke: #2f3a45; stroke-width: 1.7; fill: none; }
      .lineBlue { stroke: #2468a8; stroke-width: 2.6; fill: none; marker-end: url(#arrowBlue); }
      .dash { stroke: #677583; stroke-width: 1.7; stroke-dasharray: 5 5; fill: none; }
      .txt { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "SimSun", Arial, sans-serif; fill: #1f2a33; font-size: 25px; }
      .small { font-size: 21px; }
      .mini { font-size: 18px; }
      .label { font-weight: 700; }
      .math { font-family: "Times New Roman", Cambria, serif; font-style: italic; }
      .roman { font-family: "Times New Roman", Cambria, serif; font-style: normal; }
      .mono { font-family: Consolas, "Courier New", monospace; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="940"/>

  <!-- Input images -->
  <g id="input">
    <rect class="box" x="30" y="312" width="150" height="220" rx="10"/>
    <text class="txt mini label" x="105" y="344" text-anchor="middle">输入图像 <tspan class="math">x</tspan></text>
    <g transform="translate(53 370)">
      <rect class="tiny" x="0" y="0" width="42" height="42" style="fill:#111820"/>
      <path d="M13 32 C5 19 14 7 27 12 C36 16 35 32 22 34 C18 35 16 34 13 32Z" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <rect class="tiny" x="56" y="0" width="42" height="42" style="fill:#111820"/>
      <path d="M67 33 L85 10 M71 9 L87 9" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <rect class="tiny" x="0" y="58" width="42" height="42" style="fill:#111820"/>
      <path d="M24 7 C12 20 15 31 32 36" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <rect class="tiny" x="56" y="58" width="42" height="42" style="fill:#111820"/>
      <path d="M79 6 L65 36 M64 36 L88 36" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Classical feature extraction -->
  <g id="classical_frontend">
    <rect class="outer" x="240" y="130" width="470" height="405" rx="26"/>
    <text class="txt label" x="475" y="165" text-anchor="middle">经典特征提取与低维投影</text>

    <text class="txt small" x="332" y="226">CNN特征提取</text>
    <g id="feature_stack" transform="translate(286 262)">
      <g stroke="#465462" stroke-width="1.4" fill="#ffffff">
        <rect x="0" y="0" width="92" height="92"/>
        <rect x="10" y="-10" width="92" height="92"/>
        <rect x="20" y="-20" width="92" height="92"/>
        <rect x="30" y="-30" width="92" height="92"/>
      </g>
      <g stroke="#9aa6b2" stroke-width="1">
        <path d="M0 18 H122 M0 36 H122 M0 54 H122 M0 72 H122"/>
        <path d="M18 0 V92 M36 -4 V88 M54 -8 V84 M72 -12 V80 M90 -16 V76"/>
      </g>
      <g stroke="#465462" stroke-width="1.2" fill="#ffffff" transform="translate(115 88)">
        <rect x="0" y="0" width="18" height="18"/>
        <rect x="16" y="12" width="18" height="18"/>
        <rect x="32" y="24" width="18" height="18"/>
      </g>
    </g>
    <text class="txt mini" x="378" y="420" text-anchor="middle">卷积 + 池化</text>
    <text class="txt mini" x="378" y="448" text-anchor="middle">局部残差与形状校正</text>

    <path class="line" d="M450 322 H520"/>
    <rect class="soft" x="535" y="245" width="125" height="170" rx="12"/>
    <text class="txt small label" x="598" y="277" text-anchor="middle">低维表示</text>
    <text class="txt small math" x="598" y="305" text-anchor="middle">h</text>
    <g stroke="#465462" stroke-width="1.5" fill="#ffffff" transform="translate(585 322)">
      <rect x="0" y="0" width="24" height="70"/>
      <path d="M0 14 H24 M0 28 H24 M0 42 H24 M0 56 H24"/>
    </g>
    <text class="txt mini math" x="598" y="438" text-anchor="middle">h ∈ R<tspan baseline-shift="super" font-size="13">d</tspan></text>
  </g>

  <!-- Split node -->
  <path class="line" d="M180 422 H240"/>
  <path class="line" d="M710 334 H745"/>
  <circle cx="728" cy="334" r="5" fill="#2f3a45"/>
  <path class="line" d="M728 334 V625 H775"/>

  <!-- Quantum branch -->
  <g id="quantum_readout">
    <rect class="outer" x="745" y="30" width="820" height="460" rx="26"/>
    <text class="txt label" x="1155" y="65" text-anchor="middle">量子读出特征构造</text>

    <rect class="soft" x="780" y="107" width="118" height="295" rx="12"/>
    <text class="txt mini label" x="839" y="138" text-anchor="middle">量子输入</text>
    <text class="txt mini label" x="839" y="163" text-anchor="middle">投影</text>
    <text class="txt mini math" x="839" y="194" text-anchor="middle">q</text>
    <g stroke="#465462" stroke-width="1.4" fill="#ffffff" transform="translate(827 218)">
      <rect x="0" y="0" width="25" height="120"/>
      <path d="M0 20 H25 M0 40 H25 M0 60 H25 M0 80 H25 M0 100 H25"/>
    </g>
    <text class="txt mini math" x="839" y="374" text-anchor="middle">q ∈ R<tspan baseline-shift="super" font-size="13">d<tspan baseline-shift="sub" font-size="11">q</tspan></tspan></text>

    <path class="line" d="M898 255 H936"/>
    <rect class="soft" x="944" y="107" width="128" height="295" rx="12"/>
    <text class="txt mini label" x="1008" y="139" text-anchor="middle">角度编码</text>
    <g transform="translate(980 176)">
      <rect class="tiny" x="0" y="0" width="58" height="34" rx="5"/>
      <rect class="tiny" x="0" y="52" width="58" height="34" rx="5"/>
      <rect class="tiny" x="0" y="104" width="58" height="34" rx="5"/>
      <text class="txt mini math" x="29" y="24" text-anchor="middle">R<tspan baseline-shift="sub" font-size="12">y</tspan>(q<tspan baseline-shift="sub" font-size="12">1</tspan>)</text>
      <text class="txt mini math" x="29" y="76" text-anchor="middle">R<tspan baseline-shift="sub" font-size="12">y</tspan>(q<tspan baseline-shift="sub" font-size="12">2</tspan>)</text>
      <text class="txt mini math" x="29" y="128" text-anchor="middle">R<tspan baseline-shift="sub" font-size="12">y</tspan>(q<tspan baseline-shift="sub" font-size="12">i</tspan>)</text>
      <text class="txt mini" x="29" y="180" text-anchor="middle">⋮</text>
      <rect class="tiny" x="0" y="196" width="58" height="34" rx="5"/>
      <text class="txt mini math" x="29" y="220" text-anchor="middle">R<tspan baseline-shift="sub" font-size="12">y</tspan>(q<tspan baseline-shift="sub" font-size="12">n</tspan>)</text>
    </g>

    <path class="line" d="M1072 255 H1105"/>
    <rect class="accent" x="1115" y="107" width="295" height="295" rx="12"/>
    <text class="txt mini label" x="1262" y="139" text-anchor="middle">参数化量子映射</text>
    <g id="quantum_circuit" transform="translate(1150 178)">
      <g class="txt mini math" text-anchor="end">
        <text x="34" y="8">q<tspan baseline-shift="sub" font-size="11">1</tspan></text>
        <text x="34" y="45">q<tspan baseline-shift="sub" font-size="11">2</tspan></text>
        <text x="34" y="82">q<tspan baseline-shift="sub" font-size="11">3</tspan></text>
        <text x="34" y="119">q<tspan baseline-shift="sub" font-size="11">4</tspan></text>
        <text x="34" y="156">q<tspan baseline-shift="sub" font-size="11">5</tspan></text>
        <text x="34" y="193">q<tspan baseline-shift="sub" font-size="11">6</tspan></text>
      </g>
      <g stroke="#1f2a33" stroke-width="2" fill="none">
        <path d="M45 0 H240"/>
        <path d="M45 37 H240"/>
        <path d="M45 74 H240"/>
        <path d="M45 111 H240"/>
        <path d="M45 148 H240"/>
        <path d="M45 185 H240"/>
      </g>
      <g class="mono" font-size="15" text-anchor="middle" fill="#1f2a33">
        <rect class="tiny" x="62" y="-16" width="58" height="28" rx="4"/>
        <rect class="tiny" x="62" y="21" width="58" height="28" rx="4"/>
        <rect class="tiny" x="62" y="58" width="58" height="28" rx="4"/>
        <rect class="tiny" x="62" y="132" width="58" height="28" rx="4"/>
        <rect class="tiny" x="62" y="169" width="58" height="28" rx="4"/>
        <text x="91" y="5">U(θ)</text>
        <text x="91" y="42">U(θ)</text>
        <text x="91" y="79">U(θ)</text>
        <text x="91" y="153">U(θ)</text>
        <text x="91" y="190">U(θ)</text>
      </g>
      <g stroke="#1f2a33" stroke-width="2" fill="#ffffff">
        <circle cx="148" cy="0" r="5" fill="#1f2a33"/>
        <line x1="148" y1="0" x2="148" y2="37"/>
        <circle cx="148" cy="37" r="10"/>
        <line x1="138" y1="37" x2="158" y2="37"/>
        <line x1="148" y1="27" x2="148" y2="47"/>

        <circle cx="183" cy="37" r="5" fill="#1f2a33"/>
        <line x1="183" y1="37" x2="183" y2="74"/>
        <circle cx="183" cy="74" r="10"/>
        <line x1="173" y1="74" x2="193" y2="74"/>
        <line x1="183" y1="64" x2="183" y2="84"/>

        <circle cx="216" cy="111" r="5" fill="#1f2a33"/>
        <line x1="216" y1="111" x2="216" y2="148"/>
        <circle cx="216" cy="148" r="10"/>
        <line x1="206" y1="148" x2="226" y2="148"/>
        <line x1="216" y1="138" x2="216" y2="158"/>

        <circle cx="148" cy="185" r="5" fill="#1f2a33"/>
        <line x1="148" y1="148" x2="148" y2="185"/>
        <circle cx="148" cy="148" r="10"/>
        <line x1="138" y1="148" x2="158" y2="148"/>
        <line x1="148" y1="138" x2="148" y2="158"/>
      </g>
      <text class="txt mini" x="145" y="232" text-anchor="middle">旋转门 + 纠缠门</text>
    </g>

    <path class="line" d="M1410 255 H1440"/>
    <rect class="soft" x="1448" y="107" width="96" height="295" rx="12"/>
    <text class="txt mini label" x="1496" y="139" text-anchor="middle">多观测量</text>
    <text class="txt mini label" x="1496" y="164" text-anchor="middle">读出</text>
    <g transform="translate(1470 195)" stroke="#465462" stroke-width="2" fill="#ffffff">
      <rect x="0" y="0" width="52" height="42" rx="5"/>
      <path d="M9 30 Q26 8 43 30" fill="none"/>
      <line x1="26" y1="30" x2="40" y2="12"/>
      <rect x="0" y="70" width="52" height="42" rx="5"/>
      <path d="M9 100 Q26 78 43 100" fill="none"/>
      <line x1="26" y1="100" x2="37" y2="82"/>
      <text class="txt mini" x="26" y="145" text-anchor="middle" stroke="none">⋮</text>
      <rect x="0" y="166" width="52" height="42" rx="5"/>
      <path d="M9 196 Q26 174 43 196" fill="none"/>
      <line x1="26" y1="196" x2="38" y2="179"/>
    </g>
    <text class="txt mini math" x="1496" y="427" text-anchor="middle">Z<tspan baseline-shift="sub" font-size="12">i</tspan>, Z<tspan baseline-shift="sub" font-size="12">i</tspan>Z<tspan baseline-shift="sub" font-size="12">i+1</tspan></text>
  </g>

  <!-- Quantum feature vector -->
  <g id="quantum_feature">
    <path class="line" d="M1565 255 H1600"/>
    <rect class="soft" x="1610" y="140" width="130" height="245" rx="12"/>
    <text class="txt mini label" x="1675" y="175" text-anchor="middle">量子特征</text>
    <text class="txt mini math" x="1675" y="204" text-anchor="middle">r<tspan baseline-shift="sub" font-size="12">q</tspan></text>
    <g stroke="#465462" stroke-width="1.5" fill="#ffffff" transform="translate(1663 226)">
      <rect x="0" y="0" width="24" height="90"/>
      <path d="M0 18 H24 M0 36 H24 M0 54 H24 M0 72 H24"/>
    </g>
    <text class="txt mini math" x="1675" y="352" text-anchor="middle">r<tspan baseline-shift="sub" font-size="12">q</tspan> ∈ R<tspan baseline-shift="super" font-size="13">d<tspan baseline-shift="sub" font-size="11">q</tspan></tspan></text>
  </g>

  <!-- Classical branch -->
  <g id="classical_branch">
    <rect class="outer" x="775" y="560" width="455" height="235" rx="24"/>
    <text class="txt label" x="1002" y="595" text-anchor="middle">经典特征分支</text>
    <rect class="soft" x="815" y="632" width="170" height="105" rx="10"/>
    <text class="txt mini label" x="900" y="665" text-anchor="middle">经典特征投影</text>
    <g stroke="#2f3a45" stroke-width="2" fill="#ffffff" transform="translate(850 686)">
      <circle cx="0" cy="0" r="7"/>
      <circle cx="0" cy="34" r="7"/>
      <circle cx="48" cy="-15" r="7"/>
      <circle cx="48" cy="17" r="7"/>
      <circle cx="48" cy="49" r="7"/>
      <circle cx="98" cy="0" r="7"/>
      <circle cx="98" cy="34" r="7"/>
      <path d="M7 0 L41 -15 M7 0 L41 17 M7 0 L41 49 M7 34 L41 -15 M7 34 L41 17 M7 34 L41 49"/>
      <path d="M55 -15 L91 0 M55 17 L91 0 M55 49 L91 34 M55 17 L91 34"/>
    </g>
    <text class="txt mini" x="900" y="765" text-anchor="middle">全连接层投影</text>
    <path class="line" d="M985 685 H1040"/>
    <rect class="soft" x="1055" y="625" width="125" height="125" rx="10"/>
    <text class="txt mini label" x="1118" y="656" text-anchor="middle">经典特征</text>
    <g stroke="#465462" stroke-width="1.5" fill="#ffffff" transform="translate(1105 678)">
      <rect x="0" y="0" width="24" height="52"/>
      <path d="M0 13 H24 M0 26 H24 M0 39 H24"/>
    </g>
    <text class="txt mini math" x="1118" y="770" text-anchor="middle">c ∈ R<tspan baseline-shift="super" font-size="13">d<tspan baseline-shift="sub" font-size="11">c</tspan></tspan></text>
  </g>

  <!-- Fusion block -->
  <g id="gated_fusion">
    <rect class="outer" x="1278" y="540" width="350" height="320" rx="24"/>
    <text class="txt label" x="1453" y="575" text-anchor="middle">门控融合分类</text>
    <rect class="soft" x="1315" y="600" width="275" height="160" rx="10"/>
    <text class="txt mini label" x="1452" y="630" text-anchor="middle">Logit残差融合</text>
    <text class="txt mini math" x="1345" y="666">z<tspan baseline-shift="sub" font-size="12">c</tspan></text>
    <text class="txt mini math" x="1345" y="715">z̃<tspan baseline-shift="sub" font-size="12">q</tspan></text>
    <text class="txt mini math" x="1345" y="746">λ</text>
    <path class="lineThin" d="M1385 662 H1472"/>
    <path class="lineThin" d="M1385 711 H1450"/>
    <circle cx="1485" cy="662" r="18" fill="#ffffff" stroke="#2f3a45" stroke-width="2"/>
    <text class="txt small" x="1485" y="670" text-anchor="middle">+</text>
    <circle cx="1454" cy="711" r="16" fill="#ffffff" stroke="#2f3a45" stroke-width="2"/>
    <text class="txt small" x="1454" y="719" text-anchor="middle">⊙</text>
    <path class="lineThin" d="M1454 711 H1485 V680"/>
    <path class="lineThin" d="M1378 740 C1405 740 1420 724 1438 715"/>
    <path class="lineThin" d="M1503 662 H1542"/>
    <g stroke="#465462" stroke-width="1.5" fill="#ffffff" transform="translate(1546 627)">
      <rect x="0" y="0" width="22" height="92"/>
      <path d="M0 18 H22 M0 36 H22 M0 54 H22 M0 72 H22"/>
    </g>
    <text class="txt mini math" x="1452" y="795" text-anchor="middle">z = z<tspan baseline-shift="sub" font-size="12">c</tspan> + λ ⊙ z̃<tspan baseline-shift="sub" font-size="12">q</tspan></text>

    <rect class="soft" x="1320" y="785" width="260" height="55" rx="10"/>
    <text class="txt mini label" x="1370" y="819" text-anchor="middle">分类器</text>
    <g transform="translate(1435 812)" stroke="#2f3a45" stroke-width="2" fill="#ffffff">
      <rect x="-30" y="-18" width="42" height="36" rx="5"/>
      <circle cx="42" cy="-17" r="5"/>
      <circle cx="42" cy="0" r="5"/>
      <circle cx="42" cy="17" r="5"/>
      <circle cx="88" cy="-8" r="5"/>
      <circle cx="88" cy="8" r="5"/>
      <path d="M12 -10 L37 -17 M12 0 L37 0 M12 10 L37 17 M47 -17 L83 -8 M47 0 L83 -8 M47 17 L83 8"/>
    </g>
  </g>

  <!-- Branch arrows to fusion and output -->
  <path class="lineBlue" d="M1675 385 V520 H1450 V600"/>
  <path class="line" d="M1180 685 H1278"/>
  <path class="line" d="M1454 760 V785"/>
  <path class="line" d="M1628 700 H1660"/>
  <g id="output">
    <rect class="box" x="1660" y="592" width="112" height="220" rx="12"/>
    <text class="txt mini label" x="1716" y="626" text-anchor="middle">分类输出</text>
    <text class="txt small math" x="1716" y="662" text-anchor="middle">ŷ</text>
    <g class="txt small math" text-anchor="middle">
      <text x="1716" y="704">ŷ<tspan baseline-shift="sub" font-size="12">1</tspan></text>
      <text x="1716" y="742">ŷ<tspan baseline-shift="sub" font-size="12">2</tspan></text>
      <text x="1716" y="777">⋮</text>
      <text x="1716" y="807">ŷ<tspan baseline-shift="sub" font-size="12">C</tspan></text>
    </g>
    <text class="txt mini math" x="1716" y="845" text-anchor="middle">ŷ ∈ R<tspan baseline-shift="super" font-size="13">C</tspan></text>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(70 882)">
    <rect class="tiny" x="0" y="-23" width="44" height="30" rx="4"/>
    <text class="txt mini math" x="22" y="-2" text-anchor="middle">R<tspan baseline-shift="sub" font-size="11">y</tspan></text>
    <text class="txt mini" x="60" y="0">Y轴旋转门</text>

    <rect class="tiny" x="220" y="-23" width="58" height="30" rx="4"/>
    <text class="txt mini mono" x="249" y="-2" text-anchor="middle">U(θ)</text>
    <text class="txt mini" x="295" y="0">参数化旋转门</text>

    <rect class="tiny" x="480" y="-23" width="44" height="30" rx="4"/>
    <path d="M488 -1 Q502 -18 516 -1" fill="none" stroke="#2f3a45" stroke-width="1.8"/>
    <line x1="504" y1="-1" x2="516" y2="-17" stroke="#2f3a45" stroke-width="1.8"/>
    <text class="txt mini" x="540" y="0">测量（期望值）</text>

    <circle cx="785" cy="-8" r="5" fill="#1f2a33"/>
    <line x1="750" y1="-8" x2="820" y2="-8" stroke="#1f2a33" stroke-width="2"/>
    <circle cx="820" cy="-8" r="13" fill="#ffffff" stroke="#1f2a33" stroke-width="2"/>
    <line x1="807" y1="-8" x2="833" y2="-8" stroke="#1f2a33" stroke-width="1.8"/>
    <line x1="820" y1="-21" x2="820" y2="5" stroke="#1f2a33" stroke-width="1.8"/>
    <text class="txt mini" x="850" y="0">受控纠缠门</text>

    <circle cx="1080" cy="-8" r="14" fill="#ffffff" stroke="#2f3a45" stroke-width="2"/>
    <text class="txt small" x="1080" y="0" text-anchor="middle">⊙</text>
    <text class="txt mini" x="1110" y="0">逐元素乘法</text>

    <circle cx="1300" cy="-8" r="14" fill="#ffffff" stroke="#2f3a45" stroke-width="2"/>
    <text class="txt small" x="1300" y="0" text-anchor="middle">+</text>
    <text class="txt mini" x="1330" y="0">残差相加</text>
  </g>
</svg>
